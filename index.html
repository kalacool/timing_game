<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5.20 秒挑戰遊戲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f1e8 0%, #e8dcc8 50%, #f0e6d6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #e6ca9a;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .player-info {
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #f9f7f4 0%, #f5f1e8 100%);
            border-radius: 10px;
            border: 1px solid #e8dcc8;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .player-text-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: flex-start;
        }

        .player-label {
            color: #8b7355;
            font-weight: 500;
            font-size: 0.9em;
        }

        .player-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .player-name {
            color: #d4a574;
            font-weight: bold;
            font-size: 1.2em;
        }

        .change-player-btn {
            padding: 8px 20px;
            font-size: 0.9em;
            border: 1.5px solid #d4a574;
            background: white;
            color: #d4a574;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .change-player-btn:hover:not(:disabled) {
            background: #d4a574;
            color: white;
            transform: translateY(-2px);
        }

        .change-player-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 10px 20px;
            font-size: 1em;
            border: 2px solid #e6ca9a;
            background: white;
            color: #e6ca9a;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .mode-btn:hover {
            background: #f3f4f6;
            transform: translateY(-2px);
        }

        .mode-btn.active {
            background: #e6ca9a;
            color: white;
        }

        .timer-display {
            text-align: center;
            font-size: 4em;
            font-weight: bold;
            color: #333;
            margin: 30px 0;
            font-family: 'Courier New', monospace;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-display.perfect {
            color: #10b981;
            animation: pulse 0.5s ease-in-out;
        }

        .timer-display.close {
            color: #f59e0b;
        }

        .timer-display.far {
            color: #ef4444;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        button {
            padding: 60px 80px;
            font-size: 2.2em;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
        }

        .toggle-btn {
            background: #10b981;
            color: white;
            min-width: 200px;
        }

        .toggle-btn:hover {
            transform: translateY(-2px);
        }

        .toggle-btn.running {
            background: #ef4444;
        }

        .toggle-btn:hover:not(.running) {
            background: #059669;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        .toggle-btn.running:hover {
            background: #dc2626;
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .records-section {
            margin-top: 30px;
        }

        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .records-header h2 {
            color: #333;
            font-size: 1.3em;
        }

        .clear-all-btn {
            padding: 8px 20px;
            font-size: 0.9em;
            background: #6b7280;
            color: white;
        }

        .clear-all-btn:hover:not(:disabled) {
            background: #4b5563;
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(107, 114, 128, 0.4);
        }

        .records-list {
            max-height: 300px;
            overflow-y: auto;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 10px;
        }

        .record-item {
            display: flex;
            flex-direction: column;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: #f9fafb;
            border-radius: 10px;
            transition: all 0.2s ease;
            gap: 8px;
        }

        .record-item:hover {
            background: #f3f4f6;
            transform: translateX(3px);
        }

        .record-top {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            align-items: center;
            text-align: center;
        }

        .record-nickname {
            font-weight: bold;
            color: #e6ca9a;
            font-size: 1em;
            text-align: center;
        }

        .record-content {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
        }

        .record-main {
            display: contents;
        }

        .record-bottom {
            display: flex;
            justify-content: center;
            padding-top: 8px;
            border-top: 1px solid #e5e7eb;
        }

        .record-time {
            font-weight: bold;
            font-size: 1.1em;
            font-family: 'Courier New', monospace;
            text-align: center;
        }

        .record-diff {
            font-size: 0.9em;
            padding: 3px 8px;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
        }

        .record-target {
            color: #9ca3af;
            font-size: 0.85em;
            text-align: center;
        }

        /* 手機版樣式 */
        @media (max-width: 768px) {
            .record-item {
                padding: 10px;
            }

            .delete-btn {
                padding: 6px 12px;
                font-size: 0.8em;
            }
        }

        .record-diff.perfect {
            background: #d1fae5;
            color: #065f46;
        }

        .record-diff.far {
            background: #fee2e2;
            color: #991b1b;
        }

        .record-diff.close {
            background: #fef3c7;
            color: #92400e;
        }

        .delete-btn {
            padding: 6px 15px;
            font-size: 0.85em;
            background: #ef4444;
            color: white;
        }

        .delete-btn:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        .no-records {
            text-align: center;
            color: #9ca3af;
            padding: 30px;
            font-style: italic;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 0.85em;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #e6ca9a;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: #4a4747;
            font-size: 1em;
            font-weight: bold;
            border-top: 2px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>我愛你 💒 一生一世</h1>
        <p class="subtitle">用你的真心，停在最完美的時刻</p>

        <div class="player-info">
            <div class="player-text-group">
                <div class="player-label">目前玩家</div>
                <span class="player-name" id="currentPlayer">點擊換人開始</span>
            </div>
            <button class="change-player-btn" onclick="changePlayer()">換人</button>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" onclick="setMode(5.20)">5.20 秒</button>
            <button class="mode-btn" onclick="setMode(13.14)">13.14 秒</button>
        </div>

        <div class="timer-display" id="timerDisplay">0.00</div>

        <div class="controls">
            <button class="toggle-btn" id="toggleBtn" onclick="toggleTimer()">開始</button>
        </div>

        <div class="records-section">
            <div class="records-header">
                <h2>📊 遊戲記錄</h2>
                <button class="clear-all-btn" id="clearAllBtn" onclick="clearAllRecords()">清除所有記錄</button>
            </div>
            
            <div class="stats" id="stats">
                <div class="stat-item">
                    <div class="stat-label">總次數</div>
                    <div class="stat-value" id="totalGames">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">完美次數</div>
                    <div class="stat-value" id="perfectGames">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">最佳成績</div>
                    <div class="stat-value" id="bestScore">--</div>
                </div>
            </div>

            <div class="records-list" id="recordsList">
                <div class="no-records">還沒有記錄，開始挑戰吧！</div>
            </div>
        </div>

        <div class="footer">
            棒槌老爹❤️婚禮小遊戲工作室
        </div>
    </div>

    <script>
        let startTime = 0;
        let timerInterval = null;
        let isRunning = false;
        let records = [];
        let targetTime = 5.20; // 預設目標時間
        let currentPlayer = ''; // 當前玩家

        // 隨機暱稱列表
        const nicknames = [
            // 經典動漫
            '維尼🐻', '悟空🐵',
            '鳴人🍥', '艾連⚔️', '提摩🍄',
            '哆啦A夢🔵', '大雄👓', '靜香🎀', '胖虎🎤', '小夫💰',
            '三井壽🏀', '柯南🔍', '小蘭🥋', '灰原💊',
            '小新🖍️', '妮妮🎀', '阿呆🐶', '正男😢', '風間👔',
            '海綿寶寶🧽', '派大星⭐', '章魚哥🐙', '蟹老闆🦀',
            '龍貓🌳', '波妞🐟', '霍爾🔥', '琪琪🧹',
            '小丸子👧', '小玉🐱', '花輪💰', '永澤🔥', '大野⚾',

            // 寶可夢
            '皮卡丘⚡', '小智🧢', '小霞💧', '小剛🪨', '火箭隊🚀',
            '傑尼龜🐢', '小火龍🔥', '妙蛙種子🌱', '卡比獸😴',

            // 迪士尼
            '唐老鴨🦆', '米奇🐭', '米妮🎀', '高飛🐶', '布魯托🐕',
            '胡迪🤠', '巴斯光年🚀', '尼莫🐠', '多莉🐟', '泰山🦍',

            // 經典卡通
            '史努比🐕', '加菲貓🐱', '湯姆🐱', '傑利🐭',

            // 網路迷因/實況主
            '杰哥😎', '阿偉😱', '彬彬🎮', '睏寶😴', '統神🎤',
            '尼克星⭐', '姜哥🔥', '韓總💼', '孔劉🎬',

            // JOJO系列
            '喬魯諾🐞', '迪奧⏰', '承太郎⭐', '徐倫🦋', '喬瑟夫🎸',

            // 格鬥/運動
            '泰森🥊', '刃牙💪', '勇次郎👹', '阿里🥊',

            // 獵人
            '小傑🎣', '奇犽⚡', '酷拉皮卡⛓️', '雷歐力💼', '西索🃏',

            // 科學家/歷史人物
            '愛因斯坦🧠', '奧本海默💣', '牛頓🍎', '特斯拉⚡', '達文西🎨',

            // 克蘇魯神話
            '克蘇魯🐙',

            // 其他動漫
            '柔美💕', '小雄🎮', '信長⚔️', '威可那🌟',
            '炭治郎🔥', '禰豆子🎋', '善逸⚡', '伊之助🐗',
            '夜神月📓', '彌海砂💕',
            '艾斯🔥', '索隆⚔️', '香吉士🚬', '娜美🍊', '喬巴🦌',
            '佐助⚡', '小櫻🌸', '卡卡西👁️', '自來也🐸',
            '傑諾斯🤖', '吹雪❄️', '龍卷🌪️',
            '炎柱🔥', '水柱🌊', '蟲柱🦋', '音柱🎵'
        ];

        // 獲取隨機暱稱
        function getRandomNickname() {
            return nicknames[Math.floor(Math.random() * nicknames.length)];
        }

        // 換人
        function changePlayer() {
            if (isRunning) return; // 遊戲進行中不能換人
            currentPlayer = getRandomNickname();
            updatePlayerDisplay();
        }

        // 更新玩家顯示
        function updatePlayerDisplay() {
            document.getElementById('currentPlayer').textContent = currentPlayer;
        }

        // 設定挑戰模式
        function setMode(time) {
            if (isRunning) return; // 遊戲進行中不能切換

            targetTime = time;

            // 更新按鈕狀態
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // 重置顯示
            document.getElementById('timerDisplay').textContent = '0.00';
            document.getElementById('timerDisplay').className = 'timer-display';
        }

        // 載入記錄
        function loadRecords() {
            const saved = localStorage.getItem('timingGameRecords');
            if (saved) {
                records = JSON.parse(saved);
                renderRecords();
            }
        }

        // 儲存記錄
        function saveRecords() {
            localStorage.setItem('timingGameRecords', JSON.stringify(records));
        }

        // 切換計時器
        function toggleTimer() {
            if (!isRunning) {
                startTimer();
            } else {
                stopTimer();
            }
        }

        // 開始計時
        function startTimer() {
            startTime = Date.now();
            isRunning = true;

            const toggleBtn = document.getElementById('toggleBtn');
            toggleBtn.textContent = '停止';
            toggleBtn.classList.add('running');
            document.getElementById('timerDisplay').className = 'timer-display';

            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                document.getElementById('timerDisplay').textContent = elapsed.toFixed(2);
            }, 10);
        }

        // 停止計時
        function stopTimer() {
            if (!isRunning) return;

            // 先計算最終時間（使用當前顯示的時間）
            const finalTime = parseFloat(((Date.now() - startTime) / 1000).toFixed(2));
            const diff = finalTime - targetTime;

            // 停止計時器
            clearInterval(timerInterval);
            isRunning = false;

            // 更新顯示為最終時間
            const display = document.getElementById('timerDisplay');
            display.textContent = finalTime.toFixed(2);

            const toggleBtn = document.getElementById('toggleBtn');
            toggleBtn.textContent = '開始';
            toggleBtn.classList.remove('running');

            // 添加視覺反饋
            if (diff === 0) {
                display.className = 'timer-display perfect';
            } else if (Math.abs(diff) <= 0.1) {
                display.className = 'timer-display close';
            } else {
                display.className = 'timer-display far';
            }

            // 記錄成績
            addRecord(finalTime, diff);
        }

        // 添加記錄
        function addRecord(time, diff) {
            const record = {
                id: Date.now(),
                time: time,
                diff: diff,
                target: targetTime,
                nickname: currentPlayer || '匿名'
            };

            records.unshift(record);
            saveRecords();
            renderRecords();
        }

        // 渲染記錄
        function renderRecords() {
            const recordsList = document.getElementById('recordsList');
            
            if (records.length === 0) {
                recordsList.innerHTML = '<div class="no-records">還沒有記錄，開始挑戰吧！</div>';
                updateStats();
                return;
            }
            
            recordsList.innerHTML = records.map((record, index) => {
                let diffClass = 'positive';
                let diffText = '';

                if (record.diff === 0) {
                    diffClass = 'perfect';
                    diffText = '完美！🎉';
                } else {
                    if (Math.abs(record.diff) <= 0.1) {
                        diffClass = 'close';
                    } else {
                        diffClass = 'far';
                    }
                    if (record.diff > 0) {
                        diffText = `+${record.diff.toFixed(2)}`;
                    } else {
                        diffText = `${record.diff.toFixed(2)}`;
                    }
                }

                const targetDisplay = record.target ? `目標: ${record.target.toFixed(2)}s` : '';
                const nickname = record.nickname || '匿名';

                return `
                    <div class="record-item">
                        <div class="record-top">
                            <span class="record-nickname">${nickname}</span>
                            <div class="record-content">
                                <span class="record-time">${record.time.toFixed(2)}s</span>
                                <span class="record-target">${targetDisplay}</span>
                            </div>
                            <span class="record-diff ${diffClass}">${diffText}</span>
                        </div>
                        <div class="record-bottom">
                            <button class="delete-btn" onclick="deleteRecord(${record.id})">刪除</button>
                        </div>
                    </div>
                `;
            }).join('');
            
            updateStats();
        }

        // 更新統計
        function updateStats() {
            const totalGames = records.length;
            const perfectGames = records.filter(r => r.diff === 0).length;
            
            let bestScore = '--';
            if (records.length > 0) {
                const closest = records.reduce((best, current) => 
                    Math.abs(current.diff) < Math.abs(best.diff) ? current : best
                );
                bestScore = closest.time.toFixed(2) + 's';
            }
            
            document.getElementById('totalGames').textContent = totalGames;
            document.getElementById('perfectGames').textContent = perfectGames;
            document.getElementById('bestScore').textContent = bestScore;
        }

        // 刪除單筆記錄
        function deleteRecord(id) {
            records = records.filter(record => record.id !== id);
            saveRecords();
            renderRecords();
        }

        // 清除所有記錄
        function clearAllRecords() {
            if (records.length === 0) return;
            
            if (confirm('確定要清除所有記錄嗎？')) {
                records = [];
                saveRecords();
                renderRecords();
            }
        }

        // 初始化
        loadRecords();
        changePlayer(); // 初始化時隨機一個玩家
    </script>
</body>
</html>
